<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>{$webname} - 公告列表</title>
    {include file="default/index/header" /}
    <style>
        .main-content { padding: 60px 0 60px; }
        .page-header { text-align: center; margin-bottom: 36px; }
        .page-header h1 { font-size: 28px; color: var(--glass-text); font-weight: 700; margin-bottom: 8px; }
        .page-header p { color: var(--glass-text-secondary); font-size: 14px; }
        .announcement-list { max-width: 860px; margin: 0 auto; }
        .announcement-item { background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur-light)); -webkit-backdrop-filter: blur(var(--glass-blur-light)); padding: 20px 24px; margin-bottom: 12px; border: 1px solid var(--glass-border); border-radius: var(--glass-radius); display: flex; justify-content: space-between; align-items: center; transition: all var(--glass-transition); gap: 16px; box-shadow: var(--glass-shadow-sm), var(--glass-shadow-inset); }
        .announcement-item:hover { border-color: var(--glass-border-strong); box-shadow: var(--glass-shadow-lg), var(--glass-shadow-inset); transform: translateY(-1px); }
        .announcement-info { flex: 1; min-width: 0; }
        .announcement-title { font-size: 15px; font-weight: 600; color: var(--glass-text); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .announcement-date { font-size: 13px; color: var(--glass-text-muted); display: flex; align-items: center; gap: 4px; }
        .announcement-link { display: inline-flex; align-items: center; gap: 6px; color: var(--glass-primary); text-decoration: none; font-size: 13px; font-weight: 500; padding: 8px 16px; border: 1.5px solid var(--glass-primary); border-radius: var(--glass-radius-sm); white-space: nowrap; transition: all var(--glass-transition); flex-shrink: 0; }
        .announcement-link:hover { background: var(--glass-primary); color: #fff; }
        .pagination { text-align: center; margin-top: 32px; }
        .no-announcements { text-align: center; padding: 60px 20px; background: var(--glass-bg); backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur)); border: 1px solid var(--glass-border); border-radius: var(--glass-radius-lg); color: var(--glass-text-muted); box-shadow: var(--glass-shadow-sm), var(--glass-shadow-inset); }
        .no-announcements i { font-size: 40px; display: block; margin-bottom: 12px; }
        @media (max-width: 768px) { .announcement-item { flex-direction: column; align-items: flex-start; gap: 12px; } .page-header h1 { font-size: 24px; } .main-content { padding: 40px 0; } }
    </style>
    <section class="main-content">
        <div class="container">
            <div class="page-header glass-animate-in"><h1>网站公告</h1><p>了解最新动态与服务更新</p></div>
            <div class="announcement-list">
                {if $announcement}
                {foreach $announcement as $a}
                <div class="announcement-item glass-reveal">
                    <div class="announcement-info"><div class="announcement-title">{$a.title}</div><div class="announcement-date"><i class="far fa-clock"></i> {$a.created_at|date="Y-m-d H:i",###}</div></div>
                    <a href="/announcement/{$a.id}" class="announcement-link">查看详情 <i class="fas fa-arrow-right"></i></a>
                </div>
                {/foreach}
                {else}
                <div class="no-announcements"><i class="fas fa-inbox"></i><p>暂无公告</p></div>
                {/if}
            </div>
            <div class="pagination">{$announcement->render()}</div>
        </div>
    </section>
    {include file="default/index/footer" /}
