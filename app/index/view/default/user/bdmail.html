{include file="default/user/header" title="绑定邮箱" /}
<main id="main-container">
    <div class="content">
        <div class="block glass-card glass-reveal">
            <div class="block-header glass-user-card-header">
                <h3 class="block-title glass-user-card-title">绑定邮箱</h3>
            </div>
            <div class="block-content">
                <form>
                    <div class="form-group">
                        <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500;color:var(--text);">新邮箱</label>
                        <input type="text" name="mail" value="" class="form-control" placeholder="请输入邮箱地址">
                    </div>
                    <div class="form-group">
                        <button type="button" id="slide-captcha-btn" style="width:100%;height:44px;border:1px dashed #2563EB;border-radius:8px;background:#EFF6FF;color:#2563EB;font-size:14px;cursor:pointer;font-weight:500;transition:all 0.2s;">
                            点击进行滑块验证
                        </button>
                        <input type="hidden" name="captcha" id="captcha-verified" value="">
                        <div id="captcha-status" style="margin-top:5px;font-size:12px;min-height:18px;"></div>
                    </div>
                    <div class="form-group" style="display:flex;gap:10px;">
                        <input type="text" class="form-control" id="code" name="code" placeholder="请输入邮箱验证码" required style="flex:1;">
                        <button class="btn btn-outline-primary glass-btn glass-btn-outline" type="button" onclick="validate()" style="white-space:nowrap;">获取验证码</button>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block glass-btn glass-btn-primary glass-btn-lg" style="width:100%;padding:12px;font-size:15px;font-weight:600;">绑定邮箱</button>
                </form>
            </div>
        </div>
    </div>
</main>
{include file="default/user/footer" /}
{include file="index@default/captcha_assets" /}
<script>
var captchaVerified = false;

if (typeof window.slideCaptcha !== 'function') {
    if (typeof console !== 'undefined' && console.error) console.error('SlideCaptcha: 滑动验证组件未加载');
    $('#slide-captcha-btn').html('验证组件加载失败，请刷新').css({
        'border-color': '#f44336',
        'background': '#FFEBEE',
        'color': '#f44336'
    });
}

$('#slide-captcha-btn').on('click', function() {
    if (typeof window.slideCaptcha !== 'function') return;
    window.slideCaptcha({
        onSuccess: function(token) {
            captchaVerified = true;
            $('#captcha-verified').val(token);
            $('#slide-captcha-btn').css({'border-color':'#4caf50','background':'#E8F5E9','color':'#4caf50'}).html('验证通过');
        },
        onError: function() {
            captchaVerified = false;
            $('#captcha-verified').val('');
            $('#slide-captcha-btn').css({'border-color':'#f44336','background':'#FFEBEE','color':'#f44336'}).html('验证失败，点击重试');
        },
        onClose: function() {
            if (!captchaVerified) {
                $('#slide-captcha-btn').css({'border-color':'#2563EB','background':'#EFF6FF','color':'#2563EB'}).html('点击进行滑块验证');
            }
        }
    });
});

function resetCaptcha() {
    captchaVerified = false;
    $('#captcha-verified').val('');
    $('#slide-captcha-btn').css({'border-color':'#2563EB','background':'#EFF6FF','color':'#2563EB'}).html('点击进行滑块验证');
}

function validate() {
    var mail = $("input[name='mail']").val();
    if(mail.length < 1){ showToast('邮箱不可为空！','danger',2500); return false; }
    if (!captchaVerified) { showToast('请先完成滑块验证！','warning',2500); return false; }
    var load = layer.load(1,{time:false});
    $.ajax({
        type:'POST', url:'', data:{ act:"validate", mail:mail, captcha:$('#captcha-verified').val() }, dataType:'json',
        success:function (data){ layer.close(load); if(data.code == 1){ showToast(data.msg,'success',2500); }else{ resetCaptcha(); showToast(data.msg,'danger',2500); } }
    });
    return false;
}
$("form").submit(function (){
    var load = layer.load(1,{time:false});
    var mail = $("input[name='mail']").val();
    var code = $("input[name='code']").val();
    if(mail.length < 1 | code.length < 1){ layer.close(load); showToast('必填项不可为空！','danger',2500); return false; }
    $.ajax({
        type:'POST', url:'', data:{ act:"modify", code:code, mail:mail }, dataType:'json',
        success:function (data){ layer.close(load); if(data.code == 1){ showToast(data.msg || '操作成功','success',1800); setTimeout(function (){ location.href = '' },1800); }else{ showToast(data.msg,'danger',2500); } }
    });
    return false;
});
</script>
