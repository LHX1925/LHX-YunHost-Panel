{include file="default/user/header" title="修改密码" /}
<main id="main-container">
    <div class="content">
        <div class="block glass-card glass-reveal">
            <div class="block-header">
                <h3 class="block-title">修改密码</h3>
            </div>
            <div class="block-content">
                <ul class="nav nav-pills nav-tabs-custom nav-justified" role="tablist" style="margin-bottom:20px;">
                    <li class="nav-item">
                        <a class="nav-link active" data-toggle="tab" href="#jmmyz" role="tab" aria-selected="true">旧密码验证</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-toggle="tab" href="#yxyz" role="tab" aria-selected="false">邮箱验证</a>
                    </li>
                </ul>
                <div class="tab-content text-muted">
                    <div id="jmmyz" class="tab-pane active" role="tabpanel">
                        <form id="form1">
                            <div class="form-group">
                                <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500;color:var(--text);">旧密码</label>
                                <input type="password" name="userPwd" placeholder="请输入旧密码" class="form-control" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500;color:var(--text);">新密码</label>
                                <input type="password" name="newUserPwd" placeholder="请输入新密码" class="form-control" autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500;color:var(--text);">确认新密码</label>
                                <input type="password" name="newUserRepwd" placeholder="再次输入新密码" class="form-control" autocomplete="off">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block" style="width:100%;padding:12px;font-size:15px;font-weight:600;">修改密码</button>
                        </form>
                    </div>
                    <div id="yxyz" class="tab-pane" role="tabpanel">
                        <form id="form2">
                            <div class="form-group">
                                <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500;color:var(--text);">邮箱</label>
                                <input type="text" name="mail" value="{$user.mail}" class="form-control" readonly>
                            </div>
                            <div class="form-group">
                                    <button type="button" id="slide-captcha-btn" style="width:100%;height:44px;border:1px dashed #2563EB;border-radius:8px;background:#EFF6FF;color:#2563EB;font-size:14px;cursor:pointer;font-weight:500;transition:all 0.2s;">
                                        点击进行滑块验证
                                    </button>
                                    <input type="hidden" name="captcha" id="captcha-verified" value="">
                                    <div id="captcha-status" style="margin-top:5px;font-size:12px;min-height:18px;"></div>
                                </div>
                            <div class="form-group" style="display:flex;gap:10px;">
                                <input type="text" class="form-control" id="code" name="code" placeholder="请输入邮箱验证码" required style="flex:1;">
                                <button class="btn btn-outline-primary" type="button" onclick="validate()" style="white-space:nowrap;">获取验证码</button>
                            </div>
                            <div class="form-group">
                                <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500;color:var(--text);">新密码</label>
                                <input type="password" name="newpass" value="" placeholder="请输入新的密码" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary btn-block" style="width:100%;padding:12px;font-size:15px;font-weight:600;">修改密码</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
{include file="default/user/footer" /}
{include file="index@default/captcha_assets" /}
<script>
    var captchaVerified = false;

    if (typeof window.slideCaptcha !== 'function') {
        if (typeof console !== 'undefined' && console.error) console.error('SlideCaptcha: 滑动验证组件未加载');
        $('#slide-captcha-btn').html('验证组件加载失败，请刷新').css({
            'border-color': '#f44336',
            'background': '#FFEBEE',
            'color': '#f44336'
        });
    }

    $('#slide-captcha-btn').on('click', function() {
        if (typeof window.slideCaptcha !== 'function') return;
        window.slideCaptcha({
            onSuccess: function(token) {
                captchaVerified = true;
                $('#captcha-verified').val(token);
                $('#slide-captcha-btn').css({'border-color':'#4caf50','background':'#E8F5E9','color':'#4caf50'}).html('验证通过');
            },
            onError: function() {
                captchaVerified = false;
                $('#captcha-verified').val('');
                $('#slide-captcha-btn').css({'border-color':'#f44336','background':'#FFEBEE','color':'#f44336'}).html('验证失败，点击重试');
            },
            onClose: function() {
                if (!captchaVerified) {
                    $('#slide-captcha-btn').css({'border-color':'#2563EB','background':'#EFF6FF','color':'#2563EB'}).html('点击进行滑块验证');
                }
            }
        });
    });

    function resetCaptcha() {
        captchaVerified = false;
        $('#captcha-verified').val('');
        $('#slide-captcha-btn').css({'border-color':'#2563EB','background':'#EFF6FF','color':'#2563EB'}).html('点击进行滑块验证');
    }

    $("#form1").submit(function (){
        var load = layer.load(1,{time:false});
        var userPwd = $("input[name='userPwd']").val();
        var newUserPwd = $("input[name='newUserPwd']").val();
        var newUserRepwd = $("input[name='newUserRepwd']").val();
        if(userPwd.length < 1 || newUserPwd.length < 1 || newUserRepwd.length < 1){
            layer.close(load); showToast('不可为空','danger',2500); return false;
        }
        $.ajax({
            type:'POST', url:'',
            data:{ act:"jmmxg", userPwd:userPwd, newUserPwd:newUserPwd, newUserRepwd:newUserRepwd },
            dataType:'json',
            success:function (data){ layer.close(load); if(data.code == 1){ showToast(data.msg,'success',2500); }else{ showToast(data.msg,'danger',2500); } }
        });
        return false;
    });
    function validate() {
        if (!captchaVerified) { showToast('请先完成滑块验证！','warning',2500); return false; }
        var load = layer.load(1,{time:false});
        $.ajax({
            type:'POST', url:'', data:{ act:"validate", captcha:$('#captcha-verified').val() }, dataType:'json',
            success:function (data){ layer.close(load); if(data.code == 1){ showToast(data.msg,'success',2500); }else{ resetCaptcha(); showToast(data.msg,'danger',2500); } }
        });
        return false;
    }
    $("#form2").submit(function (){
        var load = layer.load(1,{time:false});
        var newpass = $("input[name='newpass']").val();
        var code = $("input[name='code']").val();
        if(newpass.length < 1 | code.length < 1){ layer.close(load); showToast('必填项不可为空！','danger',2500); return false; }
        $.ajax({
            type:'POST', url:'', data:{ act:"yxmmxg", code:code, newpass:newpass }, dataType:'json',
            success:function (data){ layer.close(load); if(data.code == 1){ showToast(data.msg || '操作成功','success',1800); setTimeout(function (){ location.href = '' },1800); }else{ showToast(data.msg,'danger',2500); } }
        });
        return false;
    });
</script>
