{include file="default/user/header" title="过户记录" /}
<main id="main-container">
    <div class="content">
        <div class="block glass-card glass-reveal">
            <div class="block-header glass-user-card-header">
                <h3 class="block-title glass-user-card-title">过户记录</h3>
            </div>
            <div class="block-content">
                <div class="table-responsive">
                    <table class="table table-hover glass-user-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>详情</th>
                                <th>时间</th>
                            </tr>
                        </thead>
                        <tbody>
                            {foreach $data as $d}
                            <tr>
                                <td>{$d.id}</td>
                                <td>{$d.record}</td>
                                <td>{$d.time|date="Y-m-d H:i:s",###}</td>
                            </tr>
                            {/foreach}
                        </tbody>
                    </table>
                </div>
                <div style="text-align:center;margin-top:16px">{$data->render()}</div>
            </div>
        </div>
    </div>
</main>
{include file="default/user/footer" /}
